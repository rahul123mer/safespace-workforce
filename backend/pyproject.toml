[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-management-api"
version = "1.0.0"
description = "SafeSpace Workforce: employee, face registration, shift, camera and attendance management over the existing SafeSpace face recognition pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.27",
]

[project.scripts]
ems-api = "employee_api.cli:serve"
ems-worker = "employee_api.worker:main"
ems-admin = "employee_api.cli:main"

[tool.setuptools.packages.find]
include = ["employee_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
